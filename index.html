<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOLA EXPRESS DELIVERY — Order Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DCEAFB;
    --navy:#0F1E3D;
    --navy-3:#22386B;
    --orange:#FF6432;
    --orange-2:#E5551F;
    --yellow:#FFC736;
    --skyfill:#D9E9FC;
    --white:#FFFFFF;
    --ink:#101B31;
    --muted:#64748B;
    --line:#E1E9F6;
    --ok:#2E9E5B;
    --danger:#D9483F;
    --radius-lg:22px;
    --radius:16px;
    --shadow-sm: 0 10px 26px -14px rgba(15,30,61,0.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  #app{position:relative;z-index:1;}
  .bg-logo-wrap{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .bg-logo{position:absolute;width:780px;height:780px;object-fit:contain;mix-blend-mode:multiply;}
  .bg-logo.top{top:-200px;right:-240px;opacity:0.12;transform:rotate(-9deg);}
  .bg-logo.bottom{bottom:-230px;left:-230px;opacity:0.09;transform:rotate(7deg) scaleX(-1);}
  @media (max-width:720px){
    .bg-logo{width:420px;height:420px;}
    .bg-logo.top{top:-110px;right:-140px;}
    .bg-logo.bottom{bottom:-130px;left:-140px;}
  }
  h1,h2,h3,.display{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:14px 22px;font-weight:700;font-size:15px;}
  .btn-dark{background:var(--navy);color:#fff;}
  .btn-orange{background:var(--orange);color:#fff;}
  .btn-orange:hover{background:var(--orange-2);}
  .btn-white{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* header */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(220,234,251,0.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(15,30,61,0.06);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brandmark{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:1px solid rgba(15,30,61,0.08);}
  .brandmark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brandtext{font-family:'Archivo';font-weight:800;font-size:14px;line-height:1.15;letter-spacing:.01em;}
  .brandtext .l2{font-family:'Inter';font-weight:700;font-size:9px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;}
  .topicons{display:flex;gap:8px;}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .icon-btn.wa{background:#E9FBF0;border-color:#CFF3DC;}

  /* hero */
  .hero{padding:34px 0 8px;text-align:center;}
  .hero h1{font-size:28px;line-height:1.2;color:var(--navy);}
  .hero p{font-size:14.5px;color:var(--muted);margin-top:8px;}
  @media (max-width:480px){ .hero h1{font-size:23px;} }

  /* service grid */
  .svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:22px 0 8px;}
  @media (min-width:600px){ .svc-grid{grid-template-columns:repeat(3,1fr);} }
  .svc-card{background:#fff;border-radius:16px;padding:18px 14px;box-shadow:var(--shadow-sm);border:2px solid transparent;text-align:left;display:flex;flex-direction:column;gap:8px;}
  .svc-card.selected{border-color:var(--orange);background:#FFF3ED;}
  .svc-card .icon-badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .svc-card .nm{font-weight:700;font-size:13.5px;}
  .svc-card .pr{font-size:11.5px;color:var(--muted);}
  .svc-card.disabled{opacity:.4;}

  /* order card */
  .order-card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:26px;margin:20px 0 40px;}
  @media (max-width:480px){ .order-card{padding:20px;} }
  .order-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .order-head .sel{display:flex;align-items:center;gap:10px;}
  .order-head .icon-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .order-head .nm{font-weight:700;font-size:15px;}
  .order-head .pr{font-size:12px;color:var(--muted);}
  .change-link{background:none;border:none;font-size:12.5px;font-weight:700;color:var(--orange);}

  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .field .req{color:var(--orange);}
  .field input, .field textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:14px;color:var(--ink);background:#FAFBFD;}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--navy);background:#fff;}
  .field textarea{resize:vertical;min-height:66px;}
  .field-err{border-color:var(--danger) !important;}
  .errtext{color:var(--danger);font-size:11.5px;margin-top:5px;}
  .field-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  @media (max-width:460px){ .field-grid2{grid-template-columns:1fr;} }

  .empty-hint{text-align:center;color:var(--muted);font-size:13.5px;padding:10px 0 4px;}

  /* confirmation */
  .confirm-box{text-align:center;padding:6px 0;}
  .confirm-icon{width:56px;height:56px;border-radius:50%;background:var(--yellow);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px;}
  .confirm-title{font-size:22px;}
  .confirm-sub{color:var(--muted);font-size:14px;margin-top:10px;}
  .booking-id-box{background:var(--skyfill);border-radius:13px;padding:16px;margin:20px 0;text-align:center;}
  .booking-id-box .lbl{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
  .booking-id-box .val{font-family:'Archivo';font-weight:900;font-size:19px;color:var(--navy);margin-top:4px;}
  .confirm-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  /* track (tucked away) */
  .track-toggle{text-align:center;padding:0 0 10px;}
  .track-toggle button{background:none;border:none;font-size:12.5px;color:var(--muted);text-decoration:underline;font-weight:600;}
  .track-panel{background:#fff;border-radius:16px;box-shadow:var(--shadow-sm);padding:20px;margin-bottom:30px;}
  .track-result{background:var(--skyfill);border-radius:12px;padding:13px 15px;margin-top:14px;display:flex;align-items:center;gap:10px;}
  .track-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .track-dot.pending{background:#D98A00;}
  .track-dot.progress{background:#2554C7;}
  .track-dot.done{background:var(--ok);}
  .track-dot.cancelled{background:var(--danger);}
  .track-status{font-weight:700;font-size:13.5px;}
  .track-route{font-size:12px;color:var(--muted);margin-top:2px;}

  /* footer */
  .footer{text-align:center;padding:10px 0 90px;}
  .footer .phones{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .footer button{background:none;border:none;color:var(--muted);font-size:11.5px;text-decoration:underline;}

  .fab-wa{position:fixed;bottom:20px;right:20px;background:var(--orange);color:#fff;display:flex;align-items:center;gap:9px;padding:14px 20px;border-radius:40px;box-shadow:0 14px 30px -10px rgba(255,100,50,0.55);font-weight:700;font-size:13.5px;z-index:60;}
  @media (max-width:520px){ .fab-wa span.lbl{display:none;} .fab-wa{padding:14px;} }

  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow-sm);max-width:90%;text-align:center;}
  .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;color:var(--muted);font-size:13px;}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ============ ADMIN (unchanged, compact) ============ */
  .admin-shell{min-height:100vh;background:var(--bg);}
  .admin-top{background:var(--navy);color:#fff;padding:16px 0;position:sticky;top:0;z-index:30;}
  .admin-top .wrap{display:flex;justify-content:space-between;align-items:center;max-width:900px;}
  .admin-wrap{max-width:900px;margin:0 auto;padding:0 20px;}
  .admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 0;}
  .atab{flex-shrink:0;padding:9px 16px;border-radius:22px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);}
  .atab.active{background:var(--navy);color:var(--yellow);border-color:var(--navy);}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px 0 4px;}
  @media (max-width:600px){ .stat-grid{grid-template-columns:1fr 1fr;} }
  .stat-card{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);}
  .stat-card .num{font-family:'Archivo';font-weight:900;font-size:25px;}
  .stat-card .lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;}
  .b-row{background:#fff;border-radius:14px;padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:pointer;}
  .b-row .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .b-row .idtxt{font-family:'Archivo';font-weight:800;font-size:12.5px;color:var(--navy);}
  .b-row .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .b-row .who{font-size:13px;font-weight:600;margin-top:6px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;}
  .badge-pending{background:#FFF1DE;color:#D98A00;}
  .badge-progress{background:#E4EDFF;color:#2554C7;}
  .badge-done{background:#E4F6EA;color:var(--ok);}
  .badge-cancelled{background:#FBE5E3;color:var(--danger);}
  .empty{text-align:center;padding:44px 20px;color:var(--muted);}
  .empty .em{font-size:30px;margin-bottom:8px;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,30,61,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:20px;padding:24px 22px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-close{background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted);}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
  .summary-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--muted);}
  .summary-row .v{font-weight:600;text-align:right;}
  .status-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .stbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-size:11.5px;font-weight:700;color:var(--muted);}
  .stbtn.active{border-color:var(--navy);background:var(--navy);color:var(--yellow);}
  .pin-wrap{padding:70px 24px;text-align:center;}
  .pin-dots{display:flex;justify-content:center;gap:12px;margin:24px 0;}
  .pin-dots .d{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);}
  .pin-dots .d.filled{background:var(--navy);}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto;}
  .pinkey{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:18px;font-weight:700;}
  .svc-admin-row{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .toggle{position:relative;width:42px;height:24px;border-radius:20px;background:var(--line);border:none;flex-shrink:0;}
  .toggle.on{background:var(--ok);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;}
  .toggle.on .knob{left:20px;}
  .msg-row{background:#fff;border-radius:14px;padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .msg-row .nm{font-weight:700;font-size:13.5px;}
  .msg-row .dt{font-size:11px;color:var(--muted);}
  .msg-row .bd{font-size:13px;margin-top:6px;color:var(--ink);}
  .outline-light{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.25);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

const EMAIL_CONFIGURED = EMAILJS_SERVICE_ID.indexOf("YOUR_EMAILJS")!==0 && EMAILJS_TEMPLATE_ID.indexOf("YOUR_EMAILJS")!==0 && EMAILJS_PUBLIC_KEY.indexOf("YOUR_EMAILJS")!==0;

async function sendOrderEmail(b){
  if(!EMAIL_CONFIGURED || !window.emailjs) return;
  const svc = svcById(b.service);
  const params = {
    booking_id: b.id,
    service_name: svc ? svc.name : b.service,
    customer_name: b.customer.name,
    customer_phone: b.customer.phone,
    pickup_address: b.pickup.address,
    delivery_address: b.delivery.address,
    receiver_name: b.delivery.receiverName,
    receiver_phone: b.delivery.receiverPhone,
    notes: b.details.description || "—",
    placed_at: fmtDate(b.createdAt),
    to_email: COMPANY_EMAIL
  };
  try{ await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params); }
  catch(e){ console.error("order email failed to send", e); }
}

/* ---------------- STORAGE (Supabase) ---------------- */
let STORAGE_OK = true;
function sbHeaders(extra){
  return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }, extra||{});
}
async function storageGet(key, fallback){
  try{
    const url = `${SUPABASE_URL}/rest/v1/yex_store?k=eq.${encodeURIComponent(key)}&select=v`;
    const res = await fetch(url, { headers: sbHeaders() });
    if(!res.ok){ STORAGE_OK=false; return fallback; }
    const rows = await res.json();
    STORAGE_OK = true;
    return (rows && rows.length && rows[0].v!==undefined) ? rows[0].v : fallback;
  }catch(e){ STORAGE_OK=false; return fallback; }
}
async function storageSet(key, value){
  try{
    const url = `${SUPABASE_URL}/rest/v1/yex_store`;
    const res = await fetch(url, {
      method:"POST",
      headers: sbHeaders({ "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify({ k:key, v:value })
    });
    STORAGE_OK = res.ok;
    return res.ok;
  }catch(e){ STORAGE_OK=false; console.error("storage set failed", key, e); return false; }
}
async function loadAll(){
  if(SUPABASE_URL.indexOf("YOUR_SUPABASE")===0 || SUPABASE_ANON_KEY.indexOf("YOUR_SUPABASE")===0){
    STATE.settings = DEFAULT_SETTINGS; STATE.services = DEFAULT_SERVICES; STATE.bookings=[]; STATE.messages=[];
    STATE.loaded = true; STATE.configWarning = true;
    render();
    return;
  }
  const [settings, services, bookings, messages] = await Promise.all([
    storageGet("yex-settings", DEFAULT_SETTINGS),
    storageGet("yex-services", DEFAULT_SERVICES),
    storageGet("yex-bookings", []),
    storageGet("yex-messages", [])
  ]);
  STATE.settings = Object.assign({}, DEFAULT_SETTINGS, settings);
  STATE.services = (services && services.length) ? services : DEFAULT_SERVICES;
  STATE.bookings = bookings || [];
  STATE.messages = messages || [];
  STATE.loaded = true;
  render();
}
async function persistBookings(){ await storageSet("yex-bookings", STATE.bookings); }
async function persistServices(){ await storageSet("yex-services", STATE.services); }
async function persistSettings(){ await storageSet("yex-settings", STATE.settings); }

/* ---------------- UTIL ---------------- */
function pad(n){ return n<10?"0"+n:""+n; }
function genBookingId(){
  const d = new Date();
  return `YED-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${Math.floor(10000+Math.random()*89999)}`;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) + " · " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(s){ if(s===undefined||s===null) return ""; return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function svcById(id){ return STATE.services.find(s=>s.id===id); }
function priceLabel(svc){
  if(!svc) return "";
  if(svc.pricing.type==="fixed") return `From ₦${svc.pricing.amount.toLocaleString()}`;
  return svc.pricing.label || "Request a quote";
}
function statusBadgeClass(status){
  if(status==="Cancelled") return "badge-cancelled";
  if(status==="Completed"||status==="Delivered") return "badge-done";
  if(status==="Pending") return "badge-pending";
  return "badge-progress";
}
function trackDotClass(status){
  if(status==="Cancelled") return "cancelled";
  if(status==="Completed"||status==="Delivered") return "done";
  if(status==="Pending") return "pending";
  return "progress";
}
function showToast(msg){ STATE.toast = msg; render(); setTimeout(()=>{ STATE.toast=null; render(); }, 2200); }
function waLink(prefill){ return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(prefill||"Hello Yola Express, I would like to make a booking.")}`; }

function newOrder(){ return {name:"",phone:"",pickup:"",delivery:"",receiverName:"",receiverPhone:"",notes:""}; }

function validateOrder(){
  const o = STATE.order; const e = {};
  if(!o.name.trim()) e.name = "Your name is required.";
  if(!o.phone.trim()) e.phone = "Your phone number is required.";
  if(!o.pickup.trim()) e.pickup = "Pickup address is required.";
  if(!o.delivery.trim()) e.delivery = "Delivery address is required.";
  if(!o.receiverName.trim()) e.receiverName = "Receiver name is required.";
  if(!o.receiverPhone.trim()) e.receiverPhone = "Receiver phone is required.";
  return e;
}
async function submitOrder(){
  orderErrors = validateOrder();
  if(Object.keys(orderErrors).length){ render(); return; }
  const o = STATE.order;
  const id = genBookingId();
  const booking = {
    id, service:STATE.selectedService, createdAt:new Date().toISOString(),
    customer:{name:o.name, phone:o.phone, email:"", whatsapp:"", business:""},
    pickup:{address:o.pickup, area:"", landmark:"", contactName:"", contactPhone:""},
    delivery:{receiverName:o.receiverName, receiverPhone:o.receiverPhone, address:o.delivery, area:"", landmark:""},
    details:{description:o.notes, qty:"", preferredDate:"", preferredTime:"", instructions:"", itemValue:""},
    status:"Pending", notes:[], rider:""
  };
  STATE.bookings.unshift(booking);
  await persistBookings();
  sendOrderEmail(booking); // fire-and-forget, doesn't block confirmation
  STATE.confirmedBooking = booking;
  render();
}

function field(label, name, value, opts){

/* ---------------- HANDLERS ---------------- */
function attachHandlers(){
  document.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click", ()=>{ STATE.view = el.getAttribute("data-nav"); window.scrollTo(0,0); render(); }));
  document.querySelectorAll("[data-selectsvc]").forEach(el=>el.addEventListener("click", ()=>selectService(el.getAttribute("data-selectsvc"))));
  const changeSvc = document.getElementById("change-svc");
  if(changeSvc) changeSvc.addEventListener("click", ()=>{ STATE.selectedService=null; STATE.order=null; render(); });

  document.querySelectorAll("[data-field]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const name = el.getAttribute("data-field");
      if(name==="trackId") STATE.trackId = el.value;
      else if(name==="trackPhone") STATE.trackPhone = el.value;
      else if(STATE.order && name in STATE.order) STATE.order[name] = el.value;
    });
  });

  const submitBtn = document.getElementById("submit-order");
  if(submitBtn) submitBtn.addEventListener("click", ()=>{ submitBtn.disabled=true; submitOrder(); });
  const placeAnother = document.getElementById("place-another");
  if(placeAnother) placeAnother.addEventListener("click", newOrderReset);

  const toggleTrack = document.getElementById("toggle-track");
  if(toggleTrack) toggleTrack.addEventListener("click", ()=>{ STATE.showTrack = !STATE.showTrack; render(); });
  const doTrack = document.getElementById("do-track");
  if(doTrack) doTrack.addEventListener("click", ()=>{
    const id = (STATE.trackId||"").trim().toUpperCase();
    const phone = (STATE.trackPhone||"").trim();
    if(!id || !phone){ STATE.trackError="Please enter both booking ID and phone number."; STATE.trackResult=null; render(); return; }
    const found = STATE.bookings.find(b=> b.id.toUpperCase()===id && (b.customer.phone||"").trim()===phone);
    if(!found){ STATE.trackError="No booking found with those details."; STATE.trackResult=null; }
    else { STATE.trackError=""; STATE.trackResult=found; }
    render();
  });
}

}
function renderAdminBookings(){
  const filter = STATE.bookingFilter || "all";
  let list = STATE.bookings.slice();
  if(filter!=="all") list = list.filter(b=>b.status===filter);
  return `<div style="padding:20px 0;">
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;">
      ${["all",...STATUS_FLOW,"Cancelled"].map(s=>`<button class="atab ${filter===s?'active':''}" data-bfilter="${s}" style="flex-shrink:0;">${s==="all"?"All":s}</button>`).join("")}
    </div>
    ${list.length? list.map(renderBookingRow).join("") : `<div class="empty"><div class="em">📭</div>No orders match this filter.</div>`}
  </div>`;
}
function renderAdminServices(){
  return `<div style="padding:20px 0;">
    <h3 style="font-size:16px;margin-bottom:4px;">Services & pricing</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 16px;">Toggle availability and update pricing.</p>
    ${STATE.services.map(s=>`<div class="svc-admin-row">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="display:flex;gap:10px;align-items:center;">${ic(s.icon,18)}<strong style="font-size:13.5px;">${escapeHtml(s.name)}</strong></div>
        <button class="toggle ${s.active?'on':''}" data-svctoggle="${s.id}"><div class="knob"></div></button>
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Pricing type</label>
        <select data-svcpricetype="${s.id}">
          <option value="fixed" ${s.pricing.type==='fixed'?'selected':''}>Fixed price</option>
          <option value="quote" ${s.pricing.type==='quote'?'selected':''}>Request a quote</option>
        </select>
      </div>
      ${s.pricing.type==='fixed' ? `<div class="field" style="margin-bottom:0;"><label>Amount (₦)</label><input type="number" data-svcprice="${s.id}" value="${s.pricing.amount||0}"></div>` : ""}
    </div>`).join("")}
  </div>`;
}
function renderAdminSettings(){
  const s = STATE.settings;
  return `<div style="padding:20px 0;">
    <h3 style="font-size:16px;margin-bottom:12px;">Contact</h3>
    <div class="card" style="margin-bottom:20px;">${field("Support email","set.contactEmail",s.contactEmail,{ph:"orders@yolaexpress.com"})}</div>
    <h3 style="font-size:16px;margin-bottom:12px;">Staff PIN</h3>
    <div class="card">${field("4-digit PIN","set.adminPin",s.adminPin,{ph:"1234"})}</div>
    <button class="btn btn-dark btn-block" id="save-settings" style="margin-top:16px;">Save settings</button>
  </div>`;
}
function renderModal(){ if(STATE.modal.type==="bookingDetail") return renderBookingModal(STATE.modal.id); return ""; }
function renderBookingModal(id){
  const b = STATE.bookings.find(x=>x.id===id); if(!b) return "";
  const svc = svcById(b.service);
  return `<div class="modal-bg" id="modal-bg"><div class="modal">
    <div class="modal-head"><div><div class="idtxt" style="font-size:14px;">${b.id}</div><div class="meta" style="font-size:11.5px;color:var(--muted);">${fmtDate(b.createdAt)}</div></div><button class="modal-close" id="modal-close">✕</button></div>
    <div class="card" style="margin-bottom:14px;">
      <div class="summary-row"><div class="k">Service</div><div class="v">${svc?escapeHtml(svc.name):""}</div></div>
      <div class="summary-row"><div class="k">Name</div><div class="v">${escapeHtml(b.customer.name)}</div></div>
      <div class="summary-row"><div class="k">Phone</div><div class="v">${escapeHtml(b.customer.phone)}</div></div>
      <div class="summary-row"><div class="k">Pickup</div><div class="v">${escapeHtml(b.pickup.address)}</div></div>
      <div class="summary-row"><div class="k">Receiver</div><div class="v">${escapeHtml(b.delivery.receiverName)} · ${escapeHtml(b.delivery.receiverPhone)}</div></div>
      <div class="summary-row"><div class="k">Delivery to</div><div class="v">${escapeHtml(b.delivery.address)}</div></div>
      ${b.details.description?`<div class="summary-row"><div class="k">Notes</div><div class="v">${escapeHtml(b.details.description)}</div></div>`:""}
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Update status</div>
    <div class="status-select-grid">
      ${STATUS_FLOW.map(s=>`<button class="stbtn ${b.status===s?'active':''}" data-setstatus="${s}">${s}</button>`).join("")}
      <button class="stbtn ${b.status==='Cancelled'?'active':''}" data-setstatus="Cancelled" style="grid-column:span 2;color:var(--danger);">Cancel order</button>
    </div>
    <div class="field" style="margin-top:16px;"><label>Assign rider</label><input id="rider-input" type="text" value="${escapeHtml(b.rider||"")}" placeholder="Rider name"></div>
    <button class="btn btn-white btn-block" id="save-rider" style="margin-bottom:10px;">Save rider</button>
    <a class="btn btn-dark btn-block" href="tel:${escapeHtml(b.customer.phone)}">Call customer</a>
  </div></div>`;
}
function attachAdminHandlers(){
  document.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click", ()=>{ STATE.view=el.getAttribute("data-nav"); window.scrollTo(0,0); render(); }));
  const logout = document.getElementById("admin-logout");
  if(logout) logout.addEventListener("click", ()=>{ STATE.adminAuthed=false; STATE.adminPinDraft=""; render(); });
  document.querySelectorAll("[data-pin]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const v = el.getAttribute("data-pin");
      if(v==="clear") STATE.adminPinDraft="";
      else if(v==="back") STATE.adminPinDraft = STATE.adminPinDraft.slice(0,-1);
      else if(STATE.adminPinDraft.length<4) STATE.adminPinDraft += v;
      if(STATE.adminPinDraft.length===4){
        if(STATE.adminPinDraft===STATE.settings.adminPin){ STATE.adminAuthed=true; STATE.adminError=""; STATE.adminPinDraft=""; }
        else { STATE.adminError="Incorrect PIN. Try again."; STATE.adminPinDraft=""; }
      }
      render();
    });
  });
  document.querySelectorAll("[data-atab]").forEach(el=>el.addEventListener("click", ()=>{ STATE.adminTab = el.getAttribute("data-atab"); render(); }));
  document.querySelectorAll("[data-bfilter]").forEach(el=>el.addEventListener("click", ()=>{ STATE.bookingFilter = el.getAttribute("data-bfilter"); render(); }));
  document.querySelectorAll("[data-openbooking]").forEach(el=>el.addEventListener("click", ()=>{ STATE.modal = {type:"bookingDetail", id:el.getAttribute("data-openbooking")}; render(); }));
  const modalBg = document.getElementById("modal-bg");
  if(modalBg) modalBg.addEventListener("click", (e)=>{ if(e.target.id==="modal-bg"){ STATE.modal=null; render(); } });
  const modalClose = document.getElementById("modal-close");
  if(modalClose) modalClose.addEventListener("click", ()=>{ STATE.modal=null; render(); });
  document.querySelectorAll("[data-setstatus]").forEach(el=>el.addEventListener("click", async ()=>{ const b = STATE.bookings.find(x=>x.id===STATE.modal.id); b.status = el.getAttribute("data-setstatus"); await persistBookings(); render(); }));
  const saveRider = document.getElementById("save-rider");
  if(saveRider) saveRider.addEventListener("click", async ()=>{ const b = STATE.bookings.find(x=>x.id===STATE.modal.id); b.rider = document.getElementById("rider-input").value; await persistBookings(); showToast("Rider saved."); });
  document.querySelectorAll("[data-svctoggle]").forEach(el=>el.addEventListener("click", async ()=>{ const s = svcById(el.getAttribute("data-svctoggle")); s.active = !s.active; await persistServices(); render(); }));
  document.querySelectorAll("[data-svcpricetype]").forEach(el=>el.addEventListener("change", async ()=>{ const s = svcById(el.getAttribute("data-svcpricetype")); s.pricing.type = el.value; if(el.value==="fixed" && !s.pricing.amount) s.pricing.amount=0; await persistServices(); render(); }));
  document.querySelectorAll("[data-svcprice]").forEach(el=>el.addEventListener("input", async ()=>{ const s = svcById(el.getAttribute("data-svcprice")); s.pricing.amount = Number(el.value)||0; await persistServices(); }));
  document.querySelectorAll("[data-field]").forEach(el=>el.addEventListener("input", ()=>{ const path = el.getAttribute("data-field"); if(path.startsWith("set.")) STATE.settings[path.split(".")[1]] = el.value; }));
  const saveSettings = document.getElementById("save-settings");
  if(saveSettings) saveSettings.addEventListener("click", async ()=>{ await persistSettings(); showToast("Settings saved."); });
}

  try{
    const wrap = document.createElement("div");
    wrap.className = "bg-logo-wrap";
    wrap.innerHTML = '<img class="bg-logo top" src="'+LOGO_URI+'" alt="">'+'<img class="bg-logo bottom" src="'+LOGO_URI+'" alt="">';
    document.body.insertBefore(wrap, document.body.firstChild);
  }catch(e){ console.error("bg logo inject failed", e); }
}
injectBgLogos();

(function setFavicon(){
  try{
    const link = document.createElement('link');
    link.rel = 'icon';
    link.href = LOGO_URI;
    document.head.appendChild(link);
  }catch(e){}
})();
loadAll();

})();
